name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workshift
          POSTGRES_PASSWORD: workshift
          POSTGRES_DB: workshift_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workshift"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://workshift:workshift@localhost:5432/workshift_test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Prisma generate
        run: npm run db:generate

      - name: Run migrations
        run: npm run db:migrate

      - name: Unit tests
        run: npm run test

      - name: Integration tests
        run: npm run test:integration

      - name: Production data integrity check
        run: npm run quality:scan

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high || true
